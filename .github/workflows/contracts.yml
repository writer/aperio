name: Contracts

on:
  pull_request:
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.go.yaml"
      - "buf.gen.ts.yaml"
      - "gen/**"
      - "packages/connect/src/gen/**"
      - ".github/workflows/contracts.yml"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  protobuf-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - run: go mod download

      - name: Lint protobuf contracts
        run: go run github.com/bufbuild/buf/cmd/buf@v1.59.0 lint

      - name: Check protobuf compatibility
        run: go run github.com/bufbuild/buf/cmd/buf@v1.59.0 breaking --against '.git#branch=origin/main'

      - name: Verify generated outputs
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.59.0 generate --template buf.gen.go.yaml --exclude-path proto/cerebro
          go run github.com/bufbuild/buf/cmd/buf@v1.59.0 generate --template buf.gen.ts.yaml
          git diff --exit-code -- gen packages/connect/src/gen
          test -z "$(git status --porcelain -- gen packages/connect/src/gen)"
