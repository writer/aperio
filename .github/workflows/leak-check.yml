name: Leak Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  leak-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run leak:check
